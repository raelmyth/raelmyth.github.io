<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gal Launcher</title>
<meta name="description" content="Spin the globe, zoom into a country, and open its Eaglercraft client.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#070b16; --panel:#0d1427; --raise:#151f3a; --line:#222f52;
  --text:#eaf0ff; --muted:#8d9bbd; --accent:#f2845c; --accent-hi:#ffa985;
  --display:"Sora",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:1rem;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent-hi);outline-offset:2px}

.app{display:grid;grid-template-columns:1fr 380px;height:100vh;height:100dvh}
.stage{position:relative;min-width:0;min-height:0;background:radial-gradient(circle at 50% 45%,#10204a 0%,#070b16 70%)}
#globe{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
#globe.go{cursor:pointer}
#globe.drag{cursor:grabbing}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);padding:.3rem .65rem;border-radius:.5rem;font-size:.875rem;font-weight:500;white-space:nowrap;opacity:0;transform:translate(12px,12px)}
.tip.on{opacity:1}
.ctrl{position:absolute;left:1rem;bottom:1rem;display:flex;flex-direction:column;gap:.4rem}
.ctrl button{width:42px;height:42px;border-radius:.65rem;border:1px solid var(--line);background:rgba(13,20,39,.85);font-size:1.2rem;cursor:pointer}
.ctrl button:hover{background:var(--raise)}
.hint{position:absolute;left:50%;bottom:1rem;transform:translateX(-50%);color:var(--muted);font-size:.85rem;pointer-events:none;white-space:nowrap}

.panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.top{display:flex;align-items:center;gap:.7rem;padding:1.1rem 1.4rem;border-bottom:1px solid var(--line)}
.top svg{width:30px;height:30px;flex:none}
.top b{font-family:var(--display);font-size:1.25rem}
.top span{color:var(--muted);font-size:.85rem;margin-left:auto}
.body{flex:1;overflow-y:auto;padding:1.4rem}
.body h1{font-family:var(--display);font-size:1.5rem;line-height:1.25;margin:0 0 .5rem}
.body p{margin:.25rem 0 1rem;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:.5rem;margin-top:1.25rem}
.item{display:flex;align-items:center;gap:.8rem;width:100%;text-align:left;padding:.75rem .9rem;background:var(--raise);border:1px solid var(--line);border-radius:.75rem;cursor:pointer}
.item:hover{border-color:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.item small{display:block;color:var(--muted)}
.item .go{margin-left:auto;color:var(--muted)}
.crumb{display:inline-flex;align-items:center;gap:.4rem;background:none;border:0;color:var(--muted);cursor:pointer;padding:0;margin-bottom:1rem;font-weight:500}
.crumb:hover{color:var(--text)}
.ver{display:inline-block;background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:.1rem .7rem;font-size:.8rem;font-weight:600;color:var(--accent-hi);margin-bottom:.9rem}
.open{display:block;text-align:center;text-decoration:none;font-weight:600;background:var(--accent);color:#1b0d07;padding:.85rem 1rem;border-radius:.75rem;margin-top:1.25rem}
.open:hover{background:var(--accent-hi)}
.note{background:var(--raise);border:1px dashed var(--line);border-radius:.75rem;padding:.85rem 1rem;color:var(--muted);font-size:.9rem}
.note code{color:var(--text);background:#0b1224;padding:.1rem .35rem;border-radius:.3rem}
.foot{padding:1rem 1.4rem;border-top:1px solid var(--line);color:var(--muted);font-size:.78rem}

@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr 46vh}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .hint{display:none}
  .ctrl{flex-direction:row}
}
.err{position:fixed;left:0;right:0;top:0;z-index:9;background:#7a1f1f;color:#fff;padding:.7rem 1rem;font-size:.9rem;display:none}
.gate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:1rem;background:radial-gradient(circle at 50% 40%,#10204a 0%,#070b16 70%)}
.gate form{width:min(100%,360px);background:var(--panel);border:1px solid var(--line);border-radius:1rem;padding:1.75rem}
.gate .brandrow{display:flex;align-items:center;gap:.7rem;margin-bottom:1.25rem}
.gate .brandrow svg{width:34px;height:34px}
.gate .brandrow b{font-family:var(--display);font-size:1.4rem}
.gate h1{font-family:var(--display);font-size:1.2rem;margin:0 0 1rem}
.gate label{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin:.8rem 0 .3rem}
.gate input{width:100%;background:#0b1224;border:1px solid var(--line);border-radius:.6rem;color:var(--text);font:inherit;padding:.7rem .85rem}
.gate button{width:100%;margin-top:1.25rem;border:0;border-radius:.7rem;background:var(--accent);color:#1b0d07;font-weight:600;padding:.85rem;cursor:pointer}
.gate button:hover{background:var(--accent-hi)}
.gate button:disabled{opacity:.6;cursor:wait}
.gate .msg{min-height:1.4rem;margin:.8rem 0 0;color:#ff9b9b;font-size:.9rem}
.out{margin-left:auto;background:none;border:1px solid var(--line);border-radius:.5rem;padding:.25rem .65rem;font-size:.8rem;color:var(--muted);cursor:pointer}
.out:hover{color:var(--text);border-color:var(--muted)}
</style>
</head>
<body>
<div class="err" id="err"></div>
<div class="gate" id="gate">
  <form id="login" autocomplete="on">
    <div class="brandrow"><svg viewBox="0 0 32 32" fill="none" stroke="#f2845c" stroke-width="2" aria-hidden="true"><circle cx="16" cy="16" r="13"/><ellipse cx="16" cy="16" rx="6" ry="13"/><path d="M3 16h26M5.5 9.5h21M5.5 22.5h21"/></svg><b>Gal</b></div>
    <h1>Log in</h1>
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" required autofocus>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <p class="msg" id="msg" role="alert"></p>
    <button type="submit" id="go">Log in</button>
  </form>
</div>
<div class="app" id="app" inert>
  <div class="stage" id="stage">
    <canvas id="globe" aria-label="Interactive globe. Use the list to pick a client with the keyboard."></canvas>
    <div class="tip" id="tip"></div>
    <div class="ctrl">
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">&minus;</button>
      <button id="reset" aria-label="Reset view">&#8634;</button>
    </div>
    <div class="hint">Drag to spin. Scroll to zoom. Click a glowing country.</div>
  </div>

  <aside class="panel">
    <div class="top">
      <svg viewBox="0 0 32 32" fill="none" stroke="#f2845c" stroke-width="2" aria-hidden="true"><circle cx="16" cy="16" r="13"/><ellipse cx="16" cy="16" rx="6" ry="13"/><path d="M3 16h26M5.5 9.5h21M5.5 22.5h21"/></svg>
      <b>Gal</b><button class="out" id="logout">Log out</button>
    </div>
    <div class="body" id="body"></div>
    <div class="foot">Fan-made link page. Not affiliated with Mojang or Microsoft.</div>
  </aside>
</div>

<script>
addEventListener("error",function(e){var b=document.getElementById("err");if(!b)return;var f=(e.filename||"").split("/").pop()||"page";b.style.display="block";b.textContent="Error in "+f+(e.lineno?" (line "+e.lineno+")":"")+": "+e.message;});
</script>
<script src="vault.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
let CLIENTS = {};

</script>
<script>
let countries = [];
const $ = id => document.getElementById(id);
const esc = t => { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; };
const canvas = $("globe"), ctx = canvas.getContext("2d"), stage = $("stage"), tip = $("tip");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const proj = d3.geoOrthographic().clipAngle(90).precision(0.4);
const path = d3.geoPath(proj, ctx);
const graticule = d3.geoGraticule10();
const sphere = { type: "Sphere" };
const stars = Array.from({ length: 140 }, () => [Math.random(), Math.random(), Math.random() * 1.4 + 0.3, Math.random() * 0.6 + 0.2]);

let W = 0, H = 0, dpr = 1, base = 300, s = 300, rot = [20, -25], sel = null, hover = null, auto = !reduce, raf = 0, flying = false;

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = stage.clientWidth; H = stage.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const prev = base; base = Math.min(W, H) * 0.42;
  s = s * base / prev;
  proj.translate([W / 2, H / 2]);
  draw();
}

function draw() {
  proj.rotate(rot).scale(s);
  ctx.clearRect(0, 0, W, H);
  for (const [x, y, r, a] of stars) { ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fillRect(x * W, y * H, r, r); }
  const cx = W / 2, cy = H / 2;
  const glow = ctx.createRadialGradient(cx, cy, s * 0.98, cx, cy, s * 1.2);
  glow.addColorStop(0, "rgba(110,160,255,.35)"); glow.addColorStop(1, "rgba(110,160,255,0)");
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx, cy, s * 1.2, 0, 7); ctx.fill();
  const ocean = ctx.createRadialGradient(cx - s * 0.35, cy - s * 0.4, s * 0.1, cx, cy, s);
  ocean.addColorStop(0, "#1c3a74"); ocean.addColorStop(1, "#0a1630");
  ctx.beginPath(); path(sphere); ctx.fillStyle = ocean; ctx.fill();
  ctx.beginPath(); path(graticule); ctx.strokeStyle = "rgba(160,190,255,.09)"; ctx.lineWidth = 1; ctx.stroke();
  for (const f of countries) {
    const has = !!CLIENTS[f.properties.name];
    const isSel = f === sel, isHov = f === hover;
    ctx.beginPath(); path(f);
    ctx.fillStyle = isSel ? "#ffd2b4" : has ? (isHov ? "#ffa985" : "#f2845c") : (isHov ? "#31456f" : "#22345c");
    ctx.fill();
    ctx.strokeStyle = isSel ? "#fff" : "#0a1226"; ctx.lineWidth = isSel ? 1.6 : 0.6; ctx.stroke();
  }
  ctx.beginPath(); path(sphere); ctx.strokeStyle = "rgba(160,190,255,.25)"; ctx.lineWidth = 1; ctx.stroke();
}

function loop() {
  if (auto && !flying) { rot[0] += 0.08; draw(); raf = requestAnimationFrame(loop); } else raf = 0;
}
function kick() { if (!raf && auto) raf = requestAnimationFrame(loop); }

function countryAt(x, y) {
  const p = proj.invert([x, y]);
  if (!p || isNaN(p[0])) return null;
  const c = proj([p[0], p[1]]);
  if (Math.hypot(c[0] - x, c[1] - y) > 2) return null;
  for (const f of countries) if (d3.geoContains(f, p)) return f;
  return null;
}

/* biggest polygon of a country, so far-flung islands don't skew the zoom */
function mainPart(f) {
  if (f.geometry.type !== "MultiPolygon") return f;
  let best = null, ba = -1;
  for (const c of f.geometry.coordinates) {
    const g = { type: "Polygon", coordinates: c }, a = d3.geoArea(g);
    if (a > ba) { ba = a; best = g; }
  }
  return { type: "Feature", geometry: best, properties: f.properties };
}

function fly(rotT, sT, ms = 1100) {
  const r0 = rot.slice(), ls0 = Math.log(s), ls1 = Math.log(sT), t0 = performance.now();
  while (rotT[0] - r0[0] > 180) rotT[0] -= 360;
  while (rotT[0] - r0[0] < -180) rotT[0] += 360;
  if (reduce) ms = 1;
  flying = true;
  const step = now => {
    const t = Math.min(1, (now - t0) / ms), e = d3.easeCubicInOut(t);
    rot = [r0[0] + (rotT[0] - r0[0]) * e, r0[1] + (rotT[1] - r0[1]) * e];
    s = Math.exp(ls0 + (ls1 - ls0) * e);
    draw();
    if (t < 1) requestAnimationFrame(step); else { flying = false; kick(); }
  };
  requestAnimationFrame(step);
}

function select(f) {
  auto = false; sel = f;
  const m = mainPart(f), c = d3.geoCentroid(m), target = [-c[0], -c[1]];
  const p = d3.geoOrthographic().rotate(target).translate([0, 0]).scale(100).clipAngle(90);
  const b = d3.geoPath(p).bounds(m);
  const bw = Math.max(b[1][0] - b[0][0], 1), bh = Math.max(b[1][1] - b[0][1], 1);
  let sT = 100 * Math.min((W * 0.6) / bw, (H * 0.6) / bh);
  sT = Math.max(base * 1.5, Math.min(base * 9, sT));
  fly(target, sT);
  panel();
}
function unselect() { sel = null; panel(); fly(rot.slice(), base, 900); }

function panel() {
  const body = $("body");
  if (!sel) {
    const keys = Object.keys(CLIENTS);
    if (!keys.length) { body.innerHTML = `<h1>No clients yet</h1><p>Click any country on the globe to see its exact name, then add it to the CLIENTS list in index.html.</p>`; return; }
    body.innerHTML = `<h1>Pick a country</h1><p>Each glowing country has a client. Click one on the globe or choose from the list.</p>
      <div class="list">${keys.map(k => `<button class="item" data-c="${esc(k)}"><span class="dot"></span><span>${esc(CLIENTS[k].name)}<small>${esc(k)}</small></span><span class="go">&rsaquo;</span></button>`).join("")}</div>`;
    return;
  }
  const name = sel.properties.name, c = CLIENTS[name];
  body.innerHTML = c
    ? `<button class="crumb" id="back">&larr; Back to globe</button><p style="margin:0">${esc(name)}</p><h1>${esc(c.name)}</h1>${c.version ? `<span class="ver">Version ${esc(c.version)}</span>` : ""}${c.desc ? `<p>${esc(c.desc)}</p>` : ""}<a class="open" href="${esc(c.url)}"${/^https?:/i.test(c.url) ? ' target="_blank" rel="noopener"' : ""}>Play</a>`
    : `<button class="crumb" id="back">&larr; Back to globe</button><h1>${esc(name)}</h1><p>No client here yet.</p><div class="note">To add one, put <code>"${esc(name)}"</code> in the <code>CLIENTS</code> list at the top of the script in index.html.</div>`;
  $("back").onclick = unselect;
}

/* pointer: drag, click, pinch */
const ptrs = new Map(); let moved = 0, last = null, pinch = 0;
canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  moved = 0; last = [e.clientX, e.clientY]; auto = false; canvas.classList.add("drag");
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = Math.hypot(a[0] - b[0], a[1] - b[1]); }
});
canvas.addEventListener("pointermove", e => {
  const r = canvas.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  if (ptrs.has(e.pointerId)) {
    ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      s = Math.max(base * 0.7, Math.min(base * 10, s * d / pinch)); pinch = d; moved = 99; draw(); return;
    }
    if (flying) return;
    const dx = e.clientX - last[0], dy = e.clientY - last[1], k = 0.28 * base / s;
    moved += Math.abs(dx) + Math.abs(dy); last = [e.clientX, e.clientY];
    rot = [rot[0] + dx * k, Math.max(-85, Math.min(85, rot[1] - dy * k))]; draw(); return;
  }
  const f = countryAt(x, y);
  if (f !== hover) { hover = f; draw(); }
  canvas.classList.toggle("go", !!f);
  tip.textContent = f ? f.properties.name : "";
  tip.style.left = x + "px"; tip.style.top = y + "px"; tip.classList.toggle("on", !!f);
});
const up = e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId); canvas.classList.remove("drag");
  if (moved < 6 && ptrs.size === 0) {
    const r = canvas.getBoundingClientRect(), f = countryAt(e.clientX - r.left, e.clientY - r.top);
    if (f) select(f);
  }
};
canvas.addEventListener("pointerup", up); canvas.addEventListener("pointercancel", up);
canvas.addEventListener("pointerleave", () => { hover = null; tip.classList.remove("on"); draw(); });
canvas.addEventListener("wheel", e => {
  e.preventDefault(); auto = false;
  s = Math.max(base * 0.7, Math.min(base * 10, s * Math.exp(-e.deltaY * 0.0015))); draw();
}, { passive: false });

const zoomBy = k => { auto = false; fly(rot.slice(), Math.max(base * 0.7, Math.min(base * 10, s * k)), 350); };
$("zin").onclick = () => zoomBy(1.5);
$("zout").onclick = () => zoomBy(1 / 1.5);
$("reset").onclick = () => { sel = null; panel(); fly([rot[0], -20], base, 900); };
addEventListener("keydown", e => { if (e.key === "Escape" && sel) unselect(); });
$("body").addEventListener("click", e => {
  const b = e.target.closest(".item"); if (!b) return;
  const f = countries.find(x => x.properties.name === b.dataset.c);
  if (f) select(f);
});


/* ---------- login: decrypts the client list with the username + password ---------- */
let lastKey;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(user, pass) {
  const V = window.VAULT;
  if (!V) throw new Error("vault.js is missing");
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(user.trim().toLowerCase() + ":" + pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(V.salt), iterations: V.iter, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  lastKey = key;
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(V.iv) }, key, b64(V.data));
  return JSON.parse(new TextDecoder().decode(pt));
}
function enter(data) {
  CLIENTS = data; $("gate").remove(); $("app").inert = false; panel(); draw();
}
$("login").addEventListener("submit", async e => {
  e.preventDefault();
  const u = $("u").value, p = $("p").value, btn = $("go"), msg = $("msg");
  btn.disabled = true; msg.textContent = "";
  try {
    const data = await unlock(u, p);
    try {
      const raw = new Uint8Array(await crypto.subtle.exportKey("raw", lastKey)); let r = "";
      raw.forEach(x => r += String.fromCharCode(x)); sessionStorage.setItem("gal-s", btoa(r));
    } catch (x) {}
    enter(data);
  } catch (err) {
    msg.textContent = window.VAULT ? "Wrong username or password." : "Login file (vault.js) not found.";
    btn.disabled = false; $("p").select();
  }
});
$("logout").onclick = () => location.reload();
try { sessionStorage.removeItem("gal-s"); } catch (x) {}

new ResizeObserver(resize).observe(stage);
panel(); resize();
fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json")
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(topo => { countries = topojson.feature(topo, topo.objects.countries).features; draw(); kick(); })
  .catch(err => { const b = $("err"); b.style.display = "block"; b.textContent = "Could not load the map data: " + err.message; });
</script>
</body>
</html>
